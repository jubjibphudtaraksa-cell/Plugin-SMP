name: Build VortexCore
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o VortexCore-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: VortexCore/pom.xml
      - run: mvn --batch-mode clean package
        working-directory: VortexCore
      - uses: actions/upload-artifact@v4
        with:
          name: VortexCore
          path: VortexCore/target/VortexCore-1.0.0.jar
